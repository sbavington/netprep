{% extends "base.html" %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:420px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:32px;margin-bottom:8px;">🔐</div>
      <h1 style="font-size:24px;font-weight:700;color:var(--text);margin:0 0 8px;">Change Password</h1>
      <p style="color:var(--muted);font-size:14px;">Enter your current password and choose a new one.</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div style="padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;
          background:{% if cat=='error' %}rgba(239,68,68,.15){% else %}rgba(0,212,255,.15){% endif %};
          border:1px solid {% if cat=='error' %}rgba(239,68,68,.4){% else %}rgba(0,212,255,.4){% endif %};
          color:{% if cat=='error' %}#f87171{% else %}#00d4ff{% endif %};">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}
    <div style="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:32px;">
      <form method="POST">
        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px;">Current Password</label>
          <input type="password" name="current_password" required autofocus
            style="width:100%;box-sizing:border-box;background:#0a0f1e;border:1px solid #1e293b;border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;">
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px;">New Password</label>
          <input type="password" name="new_password" required minlength="8"
            style="width:100%;box-sizing:border-box;background:#0a0f1e;border:1px solid #1e293b;border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;">
        </div>
        <div style="margin-bottom:24px;">
          <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px;">Confirm New Password</label>
          <input type="password" name="confirm_password" required minlength="8"
            style="width:100%;box-sizing:border-box;background:#0a0f1e;border:1px solid #1e293b;border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;">
        </div>
        <button type="submit"
          style="width:100%;background:#00d4ff;color:#000;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;">
          Update Password
        </button>
      </form>
    </div>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted);">
      <a href="/forgot-password" style="color:#00d4ff;text-decoration:none;">Forgot your password?</a>
    </p>
  </div>
</div>
{% endblock %}
